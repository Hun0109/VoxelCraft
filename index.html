<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VoxelCraft 3D - 멀티플레이 샌드박스</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <!-- Three.js 3D Library -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <!-- PeerJS for WebRTC P2P Multiplayer -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <link rel="stylesheet" href="css/style.css?v=voxel_v5">
</head>
<body>
  <!-- 3D Canvas Viewport -->
  <div id="canvas-container"></div>

  <!-- Center Crosshair -->
  <div id="crosshair"></div>

  <!-- Blocker (Click to Play Overlay) -->
  <div id="blocker" style="display: none;">
    <div class="instructions-box">
      <h2 id="blocker-title">🎮 화면을 클릭하여 플레이</h2>
      <p id="blocker-desc">
        <strong>W, A, S, D</strong> : 이동 / <strong>Space</strong> : 점프 / <strong>Shift</strong> : 달리기<br>
        <strong>좌클릭</strong> : 블록 파괴 / <strong>우클릭</strong> : 블록 설치<br>
        <strong>숫자키 1~8 (또는 휠)</strong> : 블록 변경 / <strong>T or Enter</strong> : 채팅<br>
        <strong>ESC</strong> : 일시 정지 및 마우스 커서 해제
      </p>
      <button class="btn btn-primary" id="btn-start-playing" style="width: 100%; margin-top: 20px; font-size: 15px; padding: 12px;">
        ▶ 게임 시작하기 (클릭)
      </button>
    </div>
  </div>

  <!-- In-game HUD -->
  <div id="game-hud">
    <!-- Top Bar -->
    <div class="hud-top-bar">
      <div class="hud-badge">
        <span>월드 코드:</span>
        <span id="hud-room-code" style="color: #60a5fa;">----</span>
      </div>
      <div class="hud-badge" id="hud-players-count">👥 접속자: 1명</div>
      <button class="btn btn-secondary" id="btn-copy-link" style="padding: 8px 14px; font-size: 13px;">🔗 링크 복사</button>
      <button class="btn btn-ghost" onclick="window.location.reload()" style="padding: 8px 14px; font-size: 13px;">나가기</button>
    </div>

    <!-- Hotbar -->
    <div id="hotbar">
      <div class="hotbar-slot active" data-block="1">
        <span class="slot-num">1</span>
        <span class="slot-icon">🌱</span>
      </div>
      <div class="hotbar-slot" data-block="2">
        <span class="slot-num">2</span>
        <span class="slot-icon">🟫</span>
      </div>
      <div class="hotbar-slot" data-block="3">
        <span class="slot-num">3</span>
        <span class="slot-icon">🪨</span>
      </div>
      <div class="hotbar-slot" data-block="4">
        <span class="slot-num">4</span>
        <span class="slot-icon">🪵</span>
      </div>
      <div class="hotbar-slot" data-block="5">
        <span class="slot-num">5</span>
        <span class="slot-icon">🍃</span>
      </div>
      <div class="hotbar-slot" data-block="6">
        <span class="slot-num">6</span>
        <span class="slot-icon">🧱</span>
      </div>
      <div class="hotbar-slot" data-block="7">
        <span class="slot-num">7</span>
        <span class="slot-icon">💎</span>
      </div>
      <div class="hotbar-slot" data-block="8">
        <span class="slot-num">8</span>
        <span class="slot-icon">🧊</span>
      </div>
    </div>

    <!-- Chat Overlay -->
    <div id="chat-container">
      <div id="chat-messages">
        <div class="chat-message"><span class="sender">시스템:</span> <span class="text">[T] 키 또는 [Enter] 키를 눌러 채팅을 입력할 수 있습니다.</span></div>
      </div>
      <input type="text" id="chat-input" placeholder="메시지 입력 후 Enter..." maxlength="100">
    </div>
  </div>

  <!-- Main Lobby View (Before Game Starts) -->
  <div id="lobby-view">
    <div class="lobby-modal">
      <h1>VOXELCRAFT 3D</h1>
      <p class="subtitle">웹 브라우저에서 친구와 함께 즐기는 3D 복셀 샌드박스</p>

      <div class="lobby-actions">
        <button class="btn btn-primary" id="btn-host-world" style="width: 100%;">
          🌍 새 멀티 월드 생성 (방장)
        </button>

        <div class="join-row">
          <input type="text" id="input-join-code" class="text-input" placeholder="4자리 코드 입력 (예: 7K9P)" maxlength="6" style="text-transform: uppercase;">
          <button class="btn btn-secondary" id="btn-join-world">입장</button>
        </div>

        <div style="text-align: center; margin: 6px 0; color: var(--text-muted); font-size: 12px;">또는</div>

        <button class="btn btn-ghost" id="btn-solo-world" style="width: 100%;">
          🛠️ 혼자 건축하기 (솔로 모드)
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Core Scripts -->
  <script src="js/sound.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/textures.js?v=voxel_v5"></script>
  <script src="js/voxel-world.js?v=voxel_v5"></script>
  <script src="js/player.js?v=voxel_v5"></script>
  <script src="js/network.js?v=voxel_v5"></script>
  <script src="js/main.js?v=voxel_v5"></script>
</body>
</html>
